rules:
  - match: tcp dst port 23 or port 2323 or port 23231
    type: conn_handler
    target: telnet
  - match: tcp dst port 1883
    type: conn_handler
    target: mqtt
  - match: tcp dst port 6969
    type: conn_handler
    target: bittorrent
  - match: tcp dst port 25
    type: conn_handler
    target: smtp
  - match: tcp dst port 3389
    type: conn_handler
    target: rdp
  - match: tcp dst port 445
    type: conn_handler
    target: smb
  - match: tcp dst port 21
    type: conn_handler
    target: ftp
  - match: tcp dst port 5060
    type: conn_handler
    target: sip
  - match: udp dst port 5060
    type: conn_handler
    target: sip
  - match: tcp dst port 5222 or port 5223
    type: conn_handler
    target: jabber
  - match: tcp dst port 11211
    type: conn_handler
    target: memcache
  - match: tcp dst port 3260
    type: conn_handler
    target: iscsi
  - match: tcp dst port 27017
    type: conn_handler
    target: mongodb
  - match: tcp dst port 502
    type: conn_handler
    target: modbus
  - match: tcp dst port 443
    type: proxy_tcp
    target: 127.0.0.1:443
    produce: false
  - match: udp dst port 443
    type: proxy_udp
    target: 127.0.0.1:443
    produce: false
  - match: tcp dst port 9889
    type: proxy_tcp
    target: 127.0.0.1:9889
  - match: tcp dst port 3306
    type: proxy_tcp
    target: 127.0.0.1:3306
  - match: tcp
    type: conn_handler
    target: tcp
  - match: udp dst port 1194
    type: conn_handler
    target: openvpn
  - match: udp dst port 5353
    type: conn_handler
    target: mdns
  - match: udp dst port 1701
    type: conn_handler
    target: l2tp
  - match: udp dst port 19132
    type: conn_handler
    target: raknet
  - match: udp dst port 88
    type: conn_handler
    target: kerberos
  - match: udp dst port 5683
    type: conn_handler
    target: coap
  - match: udp
    type: conn_handler
    target: udp
