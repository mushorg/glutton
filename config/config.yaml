ports:
  tcp: 5000
  udp: 5001
  ssh: 22

rules_path: config/rules.yaml

addresses: ["1.2.3.4", "5.4.3.2"]

interface: eth0

producers:
  enabled: false
  http:
    enabled: false
    remote: https://localhost:9000
  hpfeeds:
    enabled: false
    host: 172.26.0.2
    port: 20000
    ident: ident
    auth: auth
    channel: test

conn_timeout: 45    # idle I/O timeout in seconds for established connections.
max_tcp_payload: 4096   # bytes
dial_timeout: 5   # timeout in seconds for proxy target connection.

capture_traffic:
  enabled: false

recall:   # per-source memory: a source returning after visit_gap gets the next response variant (SIP).
  enabled: true
  visit_gap: 1800     # seconds of silence after which a returning source starts a new visit.
  ttl: 604800         # seconds a source is remembered after it was last seen.
  max_sources: 65536  # sources kept; the least recently seen is dropped first.

openvpn:
  reply: false        # answer well-formed UDP hard resets with P_CONTROL_HARD_RESET_SERVER_V2 (default parse-only).

sip:
  reject_invites: 2   # new INVITE calls per source IP visit (see recall) answered 404 before calls ring; 0 disables.

spicy:
  enabled: true
